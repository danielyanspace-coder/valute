  ['M121.63 140.18v.06L0 70.06l39.5 68.37 164.2 94.66h79L121.63 140.18Z', '#0D90CD', [-40, -50]],
];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (p, a, b) => clamp((p - a) / (b - a));
const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eIn = (k) => k * k * k;
const eIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eBack = (k) => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const CX = 480, CY = 232;

// ---------- scenes: each returns SVG drawn around (0,0), p in 0..1 ----------

function sStart(p, t) {
  const bob = Math.sin(t * Math.PI * 2 * 1.1);
  const press = Math.max(0, Math.sin(t * Math.PI * 2 * 1.1 - 0.6)) ** 6;
  const s = 1 - press * 0.05;
  const ax = 92 + bob * 8, ay = 46 + bob * 8;
  return `
    <g transform="scale(${s})">
      <rect x="-150" y="-46" width="300" height="92" rx="46" fill="url(#gAcc)"/>
      <rect x="-150" y="-46" width="300" height="92" rx="46" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
      <text x="0" y="13" text-anchor="middle" font-size="38" font-weight="800" fill="${W}" letter-spacing="3">СТАРТ</text>
    </g>
    <g transform="translate(${ax},${ay}) rotate(-8)">
      <path d="M0 0 L0 58 L15 45 L25 68 L36 63 L26 41 L45 40 Z" fill="${W}" stroke="#0b0b0c" stroke-width="4" stroke-linejoin="round"/>
    </g>
    ${[0, 1, 2].map((i) => {
      const r = 0.4 + press * 0.6;
      const a = -2.4 + i * 0.5;
      return `<line x1="${84 + Math.cos(a) * 18}" y1="${40 + Math.sin(a) * 18}" x2="${84 + Math.cos(a) * (18 + 16 * r)}" y2="${40 + Math.sin(a) * (18 + 16 * r)}" stroke="${LAV}" stroke-width="4" stroke-linecap="round" opacity="${press}"/>`;
    }).join('')}`;
}

function sCard(p) {
  const drop = eIn(seg(p, 0.12, 0.42));
  const cy = lerp(-210, -20, drop);
  const hit = seg(p, 0.42, 0.56);
  const bump = Math.sin(hit * Math.PI) * 8;
  const coinOn = p < 0.44 ? 1 : 0;
  const chk = eBack(seg(p, 0.5, 0.66));
  const plus = eOut(seg(p, 0.46, 0.7));
  return `
    <g transform="translate(0,${bump})">
      <rect x="-140" y="-70" width="280" height="172" rx="22" fill="url(#gCard)"/>
      <rect x="-140" y="-70" width="280" height="172" rx="22" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
      <rect x="-112" y="-36" width="44" height="34" rx="7" fill="#e9ecff" opacity=".9"/>
      <path d="M-112 -19h44M-90 -36v34" stroke="${ACC2}" stroke-width="2" opacity=".5"/>
      <text x="-112" y="48" font-size="22" font-weight="700" fill="#fff" fill-opacity=".9" letter-spacing="2">•••• 4242</text>
      <g transform="translate(92,62)"><circle r="14" fill="#fff" opacity=".55"/><circle cx="18" r="14" fill="#fff" opacity=".35"/></g>
    </g>
    ${coinOn ? coin(0, cy, 34, '₽', '#ffd36b', '#2b1e00') : ''}
    <text x="0" y="${-96 - plus * 22}" text-anchor="middle" font-size="30" font-weight="800" fill="${W}" opacity="${plus * (1 - seg(p, 0.86, 1))}">+5 000 ₽</text>
    <g transform="translate(132,-62) scale(${chk})">
      <circle r="28" fill="${GREEN}" stroke="#0b0b0c" stroke-width="5"/>
      <path d="M-12 0 -3 9 13 -8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;
}

function coin(x, y, r, sym, fill, ink) {
  return `<g transform="translate(${x},${y})">
    <circle r="${r}" fill="${fill}"/>
    <circle r="${r - 6}" fill="none" stroke="${ink}" stroke-opacity=".25" stroke-width="3"/>
    <text y="${r * 0.36}" text-anchor="middle" font-size="${r * 1.05}" font-weight="800" fill="${ink}">${sym}</text>
  </g>`;
}

function sSbp(p) {
  const sc = 0.6;
  let out = `<g transform="scale(${sc}) translate(-141.5,-163)">`;
  SBP.forEach(([d, c, [dx, dy]], i) => {
    const k = eOut(seg(p, 0.06 + i * 0.045, 0.36 + i * 0.045));
    out += `<path d="${d}" fill="${c}" opacity="${k}" transform="translate(${dx * 3 * (1 - k)},${dy * 3 * (1 - k)})"/>`;
  });
  out += '</g>';
  const pulse = seg(p, 0.66, 1);
  out += `<circle r="${130 + pulse * 70}" fill="none" stroke="${LAV}" stroke-width="3" opacity="${p > 0.66 ? (1 - pulse) * 0.6 : 0}"/>`;
  return out;
}

function tether(x, y, r) {
  return `<g transform="translate(${x},${y})">
    <circle r="${r}" fill="${GREEN}"/>
    <g transform="scale(${r / 40})" fill="#fff">
      <rect x="-20" y="-20" width="40" height="9" rx="1.5"/>
      <rect x="-5" y="-20" width="10" height="42"/>
      <ellipse cx="0" cy="-2" rx="22" ry="6" fill="none" stroke="#fff" stroke-width="4"/>
    </g>
  </g>`;
}

function sDeposit(p) {
  const drop = eIn(seg(p, 0.08, 0.5));
  const y = lerp(-230, 10, drop);
  const land = seg(p, 0.5, 0.62);
  const squash = Math.sin(land * Math.PI) * 6;
  const inside = p >= 0.5;
  const plus = eOut(seg(p, 0.55, 0.78));
  let dots = '';
  if (!inside) for (let i = 1; i <= 4; i++) {
    const dy = y - 34 - i * 22;
    if (dy > -230) dots += `<circle cx="0" cy="${dy}" r="${6 - i}" fill="${LAV}" opacity="${0.8 - i * 0.16}"/>`;
  }
  return `
    ${dots}
    <g transform="translate(0,${squash})">
      <path d="M-128 12 h256" stroke="${LAV}" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
      ${tether(0, inside ? 18 + land * 4 : y, 38)}
      <path d="M-128 38 h256 v44 a22 22 0 0 1 -22 22 h-212 a22 22 0 0 1 -22 -22 Z" fill="#1c1f33" stroke="${W}" stroke-width="12" stroke-linejoin="round"/>
      <path d="M-50 72 h100" stroke="${LAV}" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text x="0" y="${-110 - plus * 16}" text-anchor="middle" font-size="30" font-weight="800" fill="${W}" opacity="${plus * (1 - seg(p, 0.86, 1))}">+50 USDT</text>`;
}

function ticket(w, h, label) {
  const r = 12, n = 13;
  return `<path d="M${-w / 2 + r} ${-h / 2} H${w / 2 - r} a${r} ${r} 0 0 1 ${r} ${r} V${-n} a${n} ${n} 0 0 0 0 ${2 * n} V${h / 2 - r} a${r} ${r} 0 0 1 ${-r} ${r} H${-w / 2 + r} a${r} ${r} 0 0 1 ${-r} ${-r} V${n} a${n} ${n} 0 0 0 0 ${-2 * n} V${-h / 2 + r} a${r} ${r} 0 0 1 ${r} ${-r} Z" fill="url(#gAcc)"/>
    <path d="M${w / 2 - 70} ${-h / 2 + 12} V${h / 2 - 12}" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="6 7"/>
    <text x="${-w / 2 + 26}" y="9" font-size="26" font-weight="800" fill="#fff">${label}</text>
    <g transform="translate(${w / 2 - 35},0)">${tether(0, 0, 18)}</g>`;
}

function sCheck(p) {
  const bub = eBack(seg(p, 0.02, 0.24));
  const fly = eOut(seg(p, 0.18, 0.5));
  const tx = lerp(-330, 0, fly), ty = lerp(160, -16, fly), rot = lerp(-28, 0, fly);
  const btn = eBack(seg(p, 0.5, 0.66));
  const tap = seg(p, 0.7, 0.8);
  const tapS = 1 - Math.sin(tap * Math.PI) * 0.06;
  const done = seg(p, 0.78, 0.86);
  return `
    <g transform="scale(${bub})">
      <path d="M-170 -96 h340 a24 24 0 0 1 24 24 v150 a24 24 0 0 1 -24 24 h-312 l-34 22 6 -28 a24 24 0 0 1 -24 -18 v-150 a24 24 0 0 1 24 -24 Z" fill="#151726" stroke="${LAV}" stroke-opacity=".5" stroke-width="3"/>
    </g>
    <g transform="translate(${tx},${ty}) rotate(${rot})">${ticket(280, 84, '10 USDT')}</g>
    <g transform="translate(0,62) scale(${btn * tapS})">
      <rect x="-128" y="-22" width="256" height="44" rx="14" fill="${done > 0 ? GREEN : '#262a40'}" />
      <text y="9" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">${done > 0 ? 'Получено ✓' : 'Получить'}</text>
    </g>`;
}

// deterministic QR-like pattern
const QR = (() => {
  const n = 21, m = [];
  let s = 7;
  const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (let y = 0; y < n; y++) { m.push([]); for (let x = 0; x < n; x++) m[y].push(rnd() > 0.52); }
  const finder = (ox, oy) => {
    for (let y = -1; y < 8; y++) for (let x = -1; x < 8; x++) {
      const X = ox + x, Y = oy + y;
      if (X < 0 || Y < 0 || X >= n || Y >= n) continue;
      const d = Math.max(Math.abs(x - 3), Math.abs(y - 3));
      m[Y][X] = d === 3 || d <= 1;
    }
  };
  finder(0, 0); finder(14, 0); finder(0, 14);
  return m;
})();

function sQr(p) {
  const fr = eBack(seg(p, 0.0, 0.2));
  const size = 168, c = size / 21;
  let cells = '';
  QR.forEach((row, y) => row.forEach((on, x) => {
    if (!on) return;
    const k = seg(p, 0.06 + ((x + y) / 42) * 0.18, 0.16 + ((x + y) / 42) * 0.18);
    cells += `<rect x="${-size / 2 + x * c + 0.6}" y="${-size / 2 + y * c + 0.6}" width="${c - 1.2}" height="${c - 1.2}" rx="1.5" fill="${W}" opacity="${k}"/>`;
  }));
  const scan = seg(p, 0.3, 0.72);
  const ly = -size / 2 - 6 + (size + 12) * (0.5 - 0.5 * Math.cos(scan * Math.PI * 2));
  const ok = eBack(seg(p, 0.72, 0.86));
  const L = 40, R = 118;
  const corner = (sx, sy) => `<path d="M${sx * R} ${sy * (R - L)} V${sy * R} H${sx * (R - L)}" fill="none" stroke="${LAV}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `
    <g transform="scale(${0.9 + fr * 0.1})" opacity="${fr}">${corner(-1, -1)}${corner(1, -1)}${corner(-1, 1)}${corner(1, 1)}</g>
    <g opacity="${1 - ok * 0.6}">${cells}</g>
    ${scan > 0 && scan < 1 ? `<rect x="-112" y="${ly - 3}" width="224" height="6" rx="3" fill="${ACC}"/><rect x="-112" y="${ly - 22}" width="224" height="44" fill="url(#gScan)" opacity=".5"/>` : ''}
    <g transform="scale(${ok})">
      <circle r="52" fill="${GREEN}" stroke="#0b0b0c" stroke-width="6"/>
      <path d="M-22 0 -6 16 24 -14" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;
}

function sP2p(p) {
  const rows = [
    { rate: '96,40', w: 0.62 },
    { rate: '97,85', w: 0.92 },
    { rate: '97,10', w: 0.78 },
  ];
  const sel = eOut(seg(p, 0.5, 0.66));
  let out = '';
  rows.forEach((r, i) => {
    const k = eOut(seg(p, 0.04 + i * 0.08, 0.3 + i * 0.08));
    const y = -78 + i * 66;
    const best = i === 1;
    const fill = best ? `rgba(127,140,255,${0.12 + sel * 0.88})` : '#151726';
    const bar = eOut(seg(p, 0.2 + i * 0.06, 0.48 + i * 0.06));
    out += `<g transform="translate(${(1 - k) * 120},${y}) scale(${best ? 1 + sel * 0.05 : 1})" opacity="${k}">
      <rect x="-170" y="-26" width="340" height="52" rx="16" fill="${fill}" stroke="${best ? LAV : '#262a40'}" stroke-opacity="${best ? 0.4 + sel * 0.6 : 1}" stroke-width="2"/>
      <circle cx="-140" cy="0" r="12" fill="${best ? '#fff' : LAV}" opacity="${best ? 0.9 : 0.5}"/>
      <rect x="-116" y="-5" width="${130 * r.w * bar}" height="10" rx="5" fill="${best ? '#fff' : LAV}" opacity="${best ? 0.75 : 0.35}"/>
      <text x="150" y="9" text-anchor="end" font-size="25" font-weight="800" fill="${best ? '#fff' : LAV}" opacity="${best ? 1 : 0.7}">${r.rate} ₽</text>
    </g>`;
  });
  const badge = eBack(seg(p, 0.6, 0.74));
  out += `<g transform="translate(150,-46) scale(${badge})">
      <rect x="-62" y="-17" width="124" height="34" rx="17" fill="${GREEN}" stroke="#0b0b0c" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">лучший курс</text>
    </g>`;
  // swap arrows above the list
  const spin = eIO(seg(p, 0.1, 0.5)) * 180;
  out += `<g transform="translate(0,-148) rotate(${spin})">
      <path d="M-20 -8 a22 22 0 0 1 38 -6 M18 -14 l2 -12 M18 -14 l-12 -1" fill="none" stroke="${W}" stroke-width="6" stroke-linecap="round"/>
      <path d="M20 8 a22 22 0 0 1 -38 6 M-18 14 l-2 12 M-18 14 l12 1" fill="none" stroke="${LAV}" stroke-width="6" stroke-linecap="round"/>
    </g>`;
  return out;
}

function sLogo(p) {
  const k = eBack(seg(p, 0.0, 0.32));
  const fold = seg(p, 0.24, 0.42);
  const shine = seg(p, 0.35, 0.75);
  return `
    <g transform="scale(${k * 4.6}) translate(-19.9,-20)">
      <path d="${LOGO_BODY}" fill="#fff"/>
      <path d="${LOGO_FOLDS}" fill="#c3c4c6" opacity="${fold}"/>
    </g>
    <clipPath id="lc"><g transform="scale(${k * 4.6}) translate(-19.9,-20)"><path d="${LOGO_BODY}"/></g></clipPath>
    <g clip-path="url(#lc)"><rect x="${-200 + shine * 400}" y="-120" width="34" height="240" fill="${ACC}" opacity=".35" transform="skewX(-20)"/></g>`;
}

// ---------- timeline ----------
const SCENES = [
  { d: 1.3, draw: sStart, cap: '' },
  { d: 1.45, draw: sCard, cap: 'Вывод на карту' },
  { d: 1.3, draw: sSbp, cap: 'Переводы по СБП' },
  { d: 1.45, draw: sDeposit, cap: 'Пополнение USDT' },
  { d: 1.5, draw: sCheck, cap: 'Чеки друзьям' },
  { d: 1.45, draw: sQr, cap: 'Оплата по QR-коду' },
  { d: 1.5, draw: sP2p, cap: 'Агрегатор P2P' },
  { d: 1.35, draw: sLogo, cap: 'Crypto IX' },
];
const TOTAL = SCENES.reduce((a, s) => a + s.d, 0);
const TR = 0.22; // in/out transition seconds

const DEFS = `<defs>
  <radialGradient id="gBg" cx="50%" cy="44%" r="62%">
    <stop offset="0" stop-color="#2a2468"/><stop offset=".45" stop-color="#14132c"/><stop offset="1" stop-color="#0b0b0c"/>
  </radialGradient>
  <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa4ff"/><stop offset="1" stop-color="${ACC2}"/></linearGradient>
  <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f99ff"/><stop offset=".6" stop-color="${ACC2}"/><stop offset="1" stop-color="#3b3fb0"/></linearGradient>
  <linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ACC}" stop-opacity="0"/><stop offset=".5" stop-color="${ACC}"/><stop offset="1" stop-color="${ACC}" stop-opacity="0"/></linearGradient>
</defs>`;

function bg(t) {
  const a = t / TOTAL * Math.PI * 2;
  let dots = '';
  for (let i = 0; i < 26; i++) {
    const ang = i * 2.399 + a * (i % 2 ? 1 : -1);
    const rr = 250 + (i * 37) % 160;
    const x = CX + Math.cos(ang) * rr * 1.25, y = 270 + Math.sin(ang) * rr * 0.62;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${1.5 + (i % 3)}" fill="${LAV}" opacity="${0.1 + (i % 4) * 0.05}"/>`;
  }
  return `<rect width="960" height="540" fill="#0b0b0c"/><rect width="960" height="540" fill="url(#gBg)"/>${dots}`;
}

function render(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  let acc = 0, i = 0;
  while (i < SCENES.length - 1 && t >= acc + SCENES[i].d) acc += SCENES[i++].d;
  const sc = SCENES[i], lt = t - acc, p = lt / sc.d;
  const kin = eOut(clamp(lt / TR)), kout = eIn(clamp((lt - (sc.d - TR)) / TR));
  const s = lerp(0.7, 1, kin) * lerp(1, 0.7, kout);
  const o = kin * (1 - kout);
  // caption
  const capY = 448 + (1 - kin) * 14 - kout * 10;
  const cap = sc.cap ? `<text x="${CX}" y="${capY}" text-anchor="middle" font-size="44" font-weight="800" fill="#fff" opacity="${o}" letter-spacing="-.5">${sc.cap}</text>` : '';
  // progress dots for the 6 features
  let prog = '';
  for (let k = 0; k < 6; k++) {
    const active = i - 1 === k;
    const w = active ? 30 : 10;
    const x = CX - 75 + k * 26 + (active ? 0 : 0);
    prog += `<rect x="${x - w / 2 + (active ? 0 : 0)}" y="500" width="${w}" height="10" rx="5" fill="${active ? LAV : '#fff'}" opacity="${active ? o : 0.18}"/>`;
  }
  if (i === 0 || i === SCENES.length - 1) prog = prog.replace(/opacity="[^"]*"/g, 'opacity="0.18"');
  document.getElementById('stage').innerHTML = DEFS + bg(t)
    + `<g transform="translate(${CX},${CY}) scale(${s})" opacity="${o}">${sc.draw(p, t)}</g>` + cap + prog;
}
window.TOTAL = TOTAL;
window.render = render;
document.fonts.ready.then(() => { window.READY = true; });
if (!location.search.includes('static')) {
  const t0 = performance.now();
  (function loop() { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
}
</script>
</body>
